version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
    env_file:
      - ./.env.docker

  redis:
    image: redis:7
    container_name: redis

  producer:
    build:
      context: ./producer
    container_name: producer
    ports:
      - "3000:3000"
    env_file:
      - ./.env.docker
    depends_on:
      - rabbitmq
      - redis

  consumer:
    build:
      context: ./consumer
    container_name: consumer
    env_file:
      - ./.env.docker
    depends_on:
      - rabbitmq
      - redis